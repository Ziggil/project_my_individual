{% load static %}

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <!-- конкретный путь к папке с конкретным стилем  -->
    <link rel="stylesheet" href="{% static 'deps/css/register.css' %}">
    <!-- путь к изображению для вкладки со страницей сайта  -->
    <link rel="shortcut icon" href="https://i.pinimg.com/originals/b8/b0/1a/b8b01a233103576ebc231661a7324bac.jpg">
    <!-- jQuery ПЕРВЫМ -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Потом регистрация -->
    <script src="{% static 'deps/js/register.js' %}" defer></script>
  </head>
  <body>
    <header>
      <h1>Регистрация</h1>
      <h3>А как же без неё?</h3>
    </header>

    <main>
      <!-- форма регистрации -->
      <form id="register-form">
        {% csrf_token %}

        <label for="id_username">Логин:</label>
        <input type="text" name="username" id="id_username" placeholder="Логин" required>

        <label for="id_email">E-mail:</label>
        <input type="email" name="email" id="id_email" placeholder="E-mail" required>

        <label for="id_password">Пароль:</label>
        <input type="password" name="password" id="id_password" placeholder="Пароль" required>

        <label for="id_password_confirm">Повтор пароля:</label>
        <input type="password" name="password_confirm" id="id_password_confirm" placeholder="Повтор пароля" required>

        <button type="button" id="registerBtn">Регистрация</button>
      </form>

      <!-- ссылка на изображение -->
      <img src="{% static 'deps/images/регестрация.jpg' %}" alt="img_register">

      <article>
        <!-- кнопки и их пути -->
        <a href="{% url 'index' %}">Вернуться на начальную страницу</a>
        <a href="{% url 'about' %}">Вернуться на страницу про нас</a>
      </article>
    </main>

    <!-- тег для нижней части сайта -->
    <footer>
      <p>Почта создателя и автора сайта: 23zahar051982@gmail.com</p>
    </footer>
  </body>
</html>
