{% extends 'main/base.html' %}

{% block title %}Удаление статьи{% endblock %}

<!-- часть страницы сайта которая изменяется  -->
{% block content %}
    <div class="features">
        <h1>Удаление статьи</h1>
         <!-- атрибут method, метод передачи данных post  -->
        <form method="post">
            <!-- уникальное и непредсказуемое значение, которое сервер генерирует для защиты веб-приложений от CSRF-атак (межсайтовой подделки запросов) -->
            {% csrf_token %}
             <!-- Тип кнопки submit, позволяет при нажатии на кнопку перезагрузить страницу, а так же отправить данные пользователя на сервер  -->
            <button class="btn btn-success" type="submit">Удалить статью</button>
        </form>
    </div>
{% endblock %}
