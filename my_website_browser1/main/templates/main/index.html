{% load static %}


<!DOCTYPE html>
<html lang="ru">
  <head>
    <!-- название страницы сайта -->
    <title>Вход</title>
    <!-- конкретный путь к папке с конкретным стилем  -->
    <link rel="stylesheet" href="{% static "deps/css/index.css" %}">
     <!-- путь к иконке сайта в браузере -->
    <link rel="shortcut icon" href="https://i.pinimg.com/originals/b8/b0/1a/b8b01a233103576ebc231661a7324bac.jpg">

    
   

 
   

   
  </head>
  
  <body>
    <header>
      <h1>Это сайт обучения WEB!</h1>
      <h3>Всё о Браузерах, Сайтах и Серверах!</h3>

    </header>
    <main>
      <article>

          <h2>Переход на другие страницы</h2>

            <a href="{% url 'users:register' %}">На страницу регистрации</a>
           <!-- двоеточие после users:... ставиться потому, что в url указано хранилище имён(namespace) 
          для всех url путей и html файллов приложение users имя users, некий общий тег и тут как бы нужно ссылаться по этому тегу на путь, 
          который потом будет ссылаться на путь, который будет запускать функцию с отображением страницы -->
            <a href="{% url 'users:login' %}">На страницу авторизации</a>
             <!-- тут также как и выше тоько уже страница входа/авторизации  -->
            <a href="{% url 'about' %}">На страницу про нас</a> 
             <!-- сам url и путь и html страница находяться в гланом приложении, поэтому не надо указывать namespace  -->


            <img src='{% static "deps/images/web_1.jpg" %}' alt="test">
             <!-- путь к изображению что хранится в папке самого проекта  -->



      </article>
    </main>
    <footer>
      <p>Почта создателя и автора сайта: 23zahar051982@gmail.com</p>
    </footer>
  </body>
</html>
