{% extends 'base_dirs/base2.html' %}
{% load static %}

{% block title %}Авторизация{% endblock %}

{% block js %}
  <script src="{% static 'deps/js/login.js' %}" defer></script>
{% endblock %}

{% block header_title %}Авторизация{% endblock %}
{% block header_subtitle %}{% endblock %}

{% block content %}
  <form method="post" id="login-form">
    {% csrf_token %}
    
    <label for="id_username">Логин:</label>
    <input type="text" name="username" id="id_username" placeholder="Логин" required>

    <label for="id_password">Пароль:</label>
    <input type="password" name="password" id="id_password" placeholder="Пароль" required>

    <button type="button" id="loginBtn">Войти</button>
  </form>

  <img src="{% static 'deps/images/вход.png' %}" alt="img_login" class="no-border-img">

  <a class="btn btn-primary" href="{% url 'index' %}" role="button">На начальную страницу</a>
{% endblock %}
