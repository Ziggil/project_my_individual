{% extends 'main/base.html' %}

{% block title %}Статьи{% endblock %}

{% block content %}
    <div class="zag_div">
        <h2 class="zag">Статьи</h2>
    </div>    
        {% if articles %}
            {% for el in articles|dictsort:"date" %}
             
                     
                <div class='statia'>
                    
                    <h2 class="zag_statia">{{ el.title }}</h2>

                    <p>{{ el.anons }}</p>
                    <!-- кнопка которая перенаправляет на страницу со всем текстов статьи -->
                    <a href="{% url 'articles:articles-detail' el.id %}" class="then" >Читать далее</a>
                </div>

            {% endfor %}
        {% else %}
            <p>У вас нет записей!</p>
        {% endif %}

    </div>

{% endblock %}
